<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBA MBA Prep — 100-Day Operating System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">IB</span>
      <div class="brand-text">
        <strong>IBA MBA Prep</strong>
        <span>100-Day System</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="dashboard">Dashboard</button>
      <button class="nav-item" data-page="today">Today</button>
      <button class="nav-item" data-page="roadmap">100-Day Plan</button>
      <button class="nav-item" data-page="books">Books</button>
      <button class="nav-item" data-page="subjects">Subjects</button>
      <button class="nav-item" data-page="revision">Revision</button>
      <button class="nav-item" data-page="mocks">Mock Tests</button>
      <button class="nav-item" data-page="weak">Weak Topics</button>
      <button class="nav-item" data-page="errors">Error Log</button>
      <button class="nav-item" data-page="notes">Notes</button>
      <button class="nav-item" data-page="progress">Progress</button>
      <button class="nav-item" data-page="vocab">Vocab Practice</button>
      <button class="nav-item" data-page="viva">VIVA Practice</button>
      <button class="nav-item" data-page="settings">Settings</button>
    </nav>

    <div class="sidebar-foot">
      <button class="mode-toggle" id="darkToggle" type="button" aria-pressed="false">Dark mode</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="search-wrap">
        <input type="search" id="globalSearch" placeholder="Search books, topics, days, notes, error log…" aria-label="Global search">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="topbar-day" id="topbarDay">Day — / 100</div>
    </header>

    <main class="content" id="content">
      <section class="page active" id="page-dashboard" data-title="Dashboard"></section>
      <section class="page" id="page-today" data-title="Today"></section>
      <section class="page" id="page-roadmap" data-title="100-Day Plan"></section>
      <section class="page" id="page-books" data-title="Books"></section>
      <section class="page" id="page-subjects" data-title="Subjects"></section>
      <section class="page" id="page-revision" data-title="Revision"></section>
      <section class="page" id="page-mocks" data-title="Mock Tests"></section>
      <section class="page" id="page-weak" data-title="Weak Topics"></section>
      <section class="page" id="page-errors" data-title="Error Log"></section>
      <section class="page" id="page-notes" data-title="Notes"></section>
      <section class="page" id="page-progress" data-title="Progress"></section>
      <section class="page" id="page-vocab" data-title="Vocab Practice"></section>
      <section class="page" id="page-viva" data-title="VIVA Practice"></section>
      <section class="page" id="page-settings" data-title="Settings"></section>
    </main>
  </div>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-page="dashboard">Home</button>
    <button class="mobile-nav-item" data-page="today">Today</button>
    <button class="mobile-nav-item" data-page="roadmap">Plan</button>
    <button class="mobile-nav-item" data-page="progress">Progress</button>
    <button class="mobile-nav-item" data-page="settings">More</button>
  </nav>
</div>

<!-- ============ MODAL (day detail / forms) ============ -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Title</h2>
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/gemini.js"></script>
  <script src="js/pdfreader.js"></script>
<script src="js/ocr.js"></script>
<script src="js/viva.js"></script>
<script src="js/planner.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
